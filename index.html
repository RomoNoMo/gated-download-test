<!DOCTYPE html>
<html>
  <head>
    <title>Gemvision Marketplace – Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        max-width: 520px;
        margin: auto;
      }

      button {
        padding: 14px 18px;
        font-size: 16px;
        cursor: pointer;
      }

      #downloads {
        display: none;
        margin-top: 24px;
        padding: 16px;
        border: 1px solid #ccc;
      }
    </style>
  </head>

  <body>
    <h1>Gemvision Marketplace</h1>

    <p id="status">
      Verify your wallet to access licensed CAD files.
    </p>

    <button id="verifyBtn" onclick="verifyWallet()">
      Verify with XUMM
    </button>

    <div id="downloads">
      <h2>Downloads</h2>
      <ul>
        <li>Download STL</li>
        <li>Download 3DM</li>
      </ul>
    </div>

    <script>
      async function verifyWallet() {
        const btn = document.getElementById("verifyBtn");
        const status = document.getElementById("status");

        btn.disabled = true;
        status.innerText = "Opening XUMM…";

        try {
          const res = await fetch("/.netlify/functions/check-ownership");
          const data = await res.json();

          if (data.redirect) {
            // ✅ Mobile: opens XUMM app
            // ✅ Desktop: shows QR code
            window.location.href = data.redirect;
          } else {
            status.innerText = "Unable to start verification.";
            btn.disabled = false;
          }
        } catch (err) {
          status.innerText = "Verification failed. Please try again.";
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
